[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmodul"
version = "0.1.0"
description = "hwpx 문서를 파싱·청킹·임베딩하는 RAG 처리 모듈"
requires-python = ">=3.11"
# hwpx / embedded-model 은 PyPI 에 없다. GitHub 저장소를 직접 가리킨다.
#
# 리랭커는 sentence-transformers 의 CrossEncoder 를 쓴다. FlagEmbedding 의
# FlagReranker 는 transformers 5 에서 사라진 API 를 불러 죽어서 뺐다(임베딩용으로는
# embedded-model 이 알아서 끌어온다).
dependencies = [
    "hwpx @ git+https://github.com/WsuRagDocumentAssistant/HwpxParser_sub.git",
    "embedded-model @ git+https://github.com/zlfm78/TestEmbeddingModelRepository.git",
    "sentence-transformers",
    "psycopg[binary]",
    "pgvector",
]

# llm_service 만 네트워크를 탄다. 검색만 쓰는 사람이 LLM 스택을 깔 이유가 없어서
# 선택적 의존성으로 뺀다.  pip install ragmodul[llm]
#
# claude / gemini 는 ai-rag-comm 이 각자 정식 SDK 를 쓴다(OpenAI 호환 계층이 아니다).
# 그 provider 를 안 쓸 거면 안 깔아도 되지만, 안 깔린 상태로 고르면 RuntimeError 가
# 난다("anthropic 패키지가 설치되지 않았습니다"). extra 를 더 쪼개기보다 같이 둔다.
[project.optional-dependencies]
llm = [
    "ai-rag-comm @ git+https://github.com/WsuRagDocumentAssistant/ServerCommunication.git",
    "anthropic",
    "google-genai",
]

[tool.setuptools.packages.find]
include = ["ragmodul*"]
