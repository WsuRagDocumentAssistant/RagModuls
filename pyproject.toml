[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmodul"
version = "0.1.0"
description = "hwpx 문서를 파싱·청킹·임베딩하는 RAG 처리 모듈"
requires-python = ">=3.11"
# hwpx / embedded-model 은 PyPI 에 없다. GitHub 저장소를 직접 가리킨다.
#
# 리랭커는 sentence-transformers 의 CrossEncoder 를 쓴다. FlagEmbedding 의
# FlagReranker 는 transformers 5 에서 사라진 API 를 불러 죽어서 뺐다(임베딩용으로는
# embedded-model 이 알아서 끌어온다).
dependencies = [
    "hwpx @ git+https://github.com/WsuRagDocumentAssistant/HwpxParser_sub.git",
    "embedded-model @ git+https://github.com/zlfm78/TestEmbeddingModelRepository.git",
    "sentence-transformers",
    "psycopg[binary]",
    "pgvector",
]

# llm_service 만 네트워크를 탄다. 검색만 쓰는 사람이 openai 를 깔 이유가 없어서
# 선택적 의존성으로 뺀다.  pip install ragmodul[llm]
#
# ai-rag-comm(ServerCommunication)은 쓰지 않는다. 그 모듈이 (prompt, model,
# max_tokens) 만 넘겨서 temperature / base_url / response_format 을 전달할 방법이
# 없다. 세 층(RestChannel, 인터페이스, OpenAIService)이 다 고쳐지면 갈아탈 수 있다.
[project.optional-dependencies]
llm = ["openai"]

[tool.setuptools.packages.find]
include = ["ragmodul*"]
